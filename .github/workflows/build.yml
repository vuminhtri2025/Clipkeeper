name: Build APK

# Cách dùng: đẩy file AiManager.zip (source) + file này (.github/workflows/build.yml) lên repo.
# Workflow tự giải nén file .zip ở thư mục gốc repo, build APK đã ký và đăng lên Releases.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write   # cần để tạo Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Keystore tích hợp sẵn (base64). Giữ nguyên để các bản build sau cài đè (update) lên bản cũ.
      KEYSTORE_BASE64: ""
      KEYSTORE_PASSWORD: "AiManager@2026"
      KEY_ALIAS: "aimanager"
      KEY_PASSWORD: "AiManager@2026"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip source
        run: |
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "::error::Không tìm thấy file .zip ở thư mục gốc repo"
            exit 1
          fi
          echo "Giải nén: $ZIP"
          rm -rf _src
          mkdir _src
          unzip -q -o "$ZIP" -d _src
          SETTINGS=$(find _src -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/__MACOSX/*' | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::Không thấy settings.gradle(.kts) trong file zip"
            exit 1
          fi
          ROOT=$(dirname "$SETTINGS")
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses (ghi file license, không cần sdkmanager)
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK: $SDK"
          sudo mkdir -p "$SDK/licenses"
          printf '%s\n' \
            "8933bad161af4178b1185d1a37fbf41ea5269c55" \
            "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            | sudo tee "$SDK/licenses/android-sdk-license" > /dev/null
          printf '%s\n' "84831b9409646a918e30573bab4c9c91346d8abd" \
            | sudo tee "$SDK/licenses/android-sdk-preview-license" > /dev/null
          ls -l "$SDK/licenses"

      - name: Restore keystore
        run: |
          mkdir -p "$PROJECT_ROOT/app/keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$PROJECT_ROOT/app/keystore/aimanager.jks"
          keytool -list -keystore "$PROJECT_ROOT/app/keystore/aimanager.jks" -storepass "$KEYSTORE_PASSWORD" | head -n 6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build release APK
        run: |
          cd "$PROJECT_ROOT"
          gradle assembleRelease --no-daemon --stacktrace

      - name: Verify signature
        run: |
          APK=$(ls "$PROJECT_ROOT"/app/build/outputs/apk/release/*.apk | head -n 1)
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | head -n 12

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp "$PROJECT_ROOT"/app/build/outputs/apk/release/*.apk "dist/QuanLyAI-${{ github.run_number }}.apk"
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyAI-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish Release (tải APK trực tiếp trên điện thoại)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" dist/*.apk \
            --repo "${{ github.repository }}" \
            --title "Quản lý AI v1.0.${{ github.run_number }}" \
            --notes "Bản build tự động #${{ github.run_number }}"
