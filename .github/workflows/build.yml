name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write   # cần để tạo Release chứa file APK

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Keystore được nhúng sẵn (base64) -> mọi bản build cùng chữ ký, cài đè cập nhật được.
      KEYSTORE_B64: ""
      KEYSTORE_PASSWORD: clipvault123
      KEY_ALIAS: clipvault
      KEY_PASSWORD: clipvault123

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip source
        run: |
          set -eu
          if [ -f ClipVault.zip ]; then ZIP=ClipVault.zip; else ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1 || true); fi
          if [ -n "$ZIP" ]; then
            echo "Giai nen: $ZIP"
            rm -rf _src && mkdir -p _src
            unzip -q -o "$ZIP" -d _src
            SETTINGS=$(find _src -maxdepth 3 -name settings.gradle.kts | head -n 1 || true)
          else
            echo "Khong co file zip, dung ma nguon trong repo"
            SETTINGS=$(find . -maxdepth 2 -name settings.gradle.kts -not -path './_src/*' | head -n 1 || true)
          fi
          if [ -z "${SETTINGS:-}" ]; then
            echo "::error::Khong tim thay settings.gradle.kts"
            exit 1
          fi
          ROOT=$(cd "$(dirname "$SETTINGS")" && pwd)
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"
          echo "Project: $ROOT"
          ls -la "$ROOT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (tu dong chap nhan license)
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Restore keystore
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$PROJECT_DIR/app/clipvault.jks"
          keytool -list -keystore "$PROJECT_DIR/app/clipvault.jks" -storepass "$KEYSTORE_PASSWORD" | head -n 8

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle -p "$PROJECT_DIR" assembleRelease --no-daemon --stacktrace

      - name: Verify signature
        run: |
          APKSIGNER=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" "dist/ClipVault-${{ github.run_number }}.apk"
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipVault-apk
          path: dist/*.apk

      - name: Publish Release (tai APK truc tiep tren dien thoai)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ClipVault build ${{ github.run_number }}
          files: dist/*.apk
