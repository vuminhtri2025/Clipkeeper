name: Build ClipKeeper APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Thông tin keystore (file app/clipkeeper.jks nằm trong mã nguồn)
  KEYSTORE_PASSWORD: clipkeeper123
  KEY_ALIAS: clipkeeper
  KEY_PASSWORD: clipkeeper123

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Giải nén mã nguồn (unzip)
        shell: bash
        run: |
          set -e
          if [ -f ClipKeeper.zip ]; then
            ZIP=ClipKeeper.zip
          else
            ZIP=""
            for z in *.zip; do
              [ -f "$z" ] || continue
              if unzip -l "$z" | grep -q "clipkeeper.jks"; then ZIP="$z"; break; fi
            done
          fi
          if [ -n "$ZIP" ]; then
            echo "Tìm thấy file zip: $ZIP"
            rm -rf _src && mkdir _src
            unzip -q -o "$ZIP" -d _src
            SEARCH=_src
          else
            echo "Không có file zip, dùng mã nguồn trong repo"
            SEARCH=.
          fi
          SETTINGS=$(find "$SEARCH" -maxdepth 4 \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::Không tìm thấy settings.gradle(.kts) trong mã nguồn"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Thư mục dự án: $PROJECT_DIR"
          ls -la "$PROJECT_DIR" "$PROJECT_DIR/app"
          test -f "$PROJECT_DIR/app/clipkeeper.jks" || { echo "::error::Thiếu keystore app/clipkeeper.jks"; exit 1; }

      - name: Kiểm tra keystore
        run: |
          keytool -list -keystore "${{ env.PROJECT_DIR }}/app/clipkeeper.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS"

      - name: Cài JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Chấp nhận license Android SDK (SDK đã có sẵn trên runner)
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sudo mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" | sudo tee "$ANDROID_HOME/licenses/android-sdk-license" > /dev/null
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" | sudo tee "$ANDROID_HOME/licenses/android-sdk-preview-license" > /dev/null

      - name: Cài Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK (release, đã ký)
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Đổi tên APK
        run: |
          mkdir -p out
          cp "${{ env.PROJECT_DIR }}"/app/build/outputs/apk/release/*.apk out/ClipKeeper.apk
          ls -la out

      - name: Upload APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ClipKeeper-apk
          path: out/ClipKeeper.apk

      - name: Tạo Release để tải APK về điện thoại
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ClipKeeper build ${{ github.run_number }}
          files: out/ClipKeeper.apk
